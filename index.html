<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>치이카와 프렌즈 실시간 그림판</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="header">
    <div class="title-bar">
      <span class="chiikawa-icons">🥺💙🐰🌰✨</span>
      <h1 class="title">치이카와 무인도 그림판 <span class="badge">야하-!</span></h1>
    </div>

    <div class="connection-box">
      <div class="row">
        <span class="label">내 친구 코드:</span>
        <strong id="myCode">불러오는 중...</strong>
        <button id="copyBtn" class="btn-yellow">복사</button>
      </div>
      <div class="row">
        <input type="text" id="targetCode" placeholder="친구 코드 입력하기">
        <button id="connectBtn" class="btn-pink">연결</button>
        <span id="status" class="status-off" title="연결 상태">●</span>
      </div>
    </div>
  </div>

  <div class="palette">
    <!-- 치이카와 친구들 상징 컬러 팔레트 -->
    <div class="color-group">
      <button class="color-dot active" data-color="#374151" style="background:#374151;" title="먹색 (기본)"></button>
      <button class="color-dot" data-color="#ff7b96" style="background:#ff7b96;" title="치이카와 핑크"></button>
      <button class="color-dot" data-color="#38bdf8" style="background:#38bdf8;" title="하치와레 블루"></button>
      <button class="color-dot" data-color="#facc15" style="background:#facc15;" title="우사기 노랑"></button>
      <button class="color-dot" data-color="#fb923c" style="background:#fb923c;" title="밤만쥬 주황"></button>
      <button class="color-dot" data-color="#a855f7" style="background:#a855f7;" title="모몽가 보라"></button>
      <button class="color-dot" data-color="#ffffff" style="background:#ffffff;" title="화이트"></button>
    </div>
    
    <div class="tool-group">
      <button id="eraserBtn" class="tool-btn">지우개</button>
      <button id="clearBtn" class="tool-btn btn-danger">전체삭제</button>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="board"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
