<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>우사기</title>
  <meta name="application-name" content="우사기">
  <meta name="apple-mobile-web-app-title" content="우사기">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="shortcut icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css?v=final3">
  
  <!-- PeerJS & Firebase SDK 로드 -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
</head>
<body>
  <header class="header">
    <div class="control-grid">
      <!-- 윗줄: 내 코드 + 호출 + 터치하면 알림이 켜지는 시계 -->
      <div id="myCode" class="grid-left" title="터치하면 코드가 복사됩니다">불러오는 중...</div>
      <button id="callBtn" class="grid-btn btn-yellow">호출</button>
      <div id="koreaClock" class="clock-plain" title="터치하면 알림 권한이 켜집니다">--:--:--</div>

      <!-- 아랫줄: 상대 코드 + 연결 + 끊기/상태 -->
      <input type="text" id="targetCode" class="grid-left" placeholder="친구 코드 입력하기">
      <button id="connectBtn" class="grid-btn btn-pink">연결</button>
      <div class="grid-extra">
        <button id="disconnectBtn" class="btn-disconnect" title="연결 해제">❌</button>
        <span id="status" class="status-off" title="연결 상태">●</span>
      </div>
    </div>
  </header>

  <nav class="palette">
    <div class="color-group">
      <button class="color-dot active" data-color="#374151" style="background:#374151;" title="먹색"></button>
      <button class="color-dot" data-color="#ff7b96" style="background:#ff7b96;" title="핑크"></button>
      <button class="color-dot" data-color="#38bdf8" style="background:#38bdf8;" title="블루"></button>
      <button class="color-dot" data-color="#facc15" style="background:#facc15;" title="옐로우"></button>
      <button class="color-dot" data-color="#fb923c" style="background:#fb923c;" title="오렌지"></button>
      <button class="color-dot" data-color="#a855f7" style="background:#a855f7;" title="퍼플"></button>
      <button class="color-dot" data-color="#ffffff" style="background:#ffffff;" title="화이트"></button>
    </div>
    
    <div class="tool-group">
      <button id="eraserBtn" class="tool-btn">지우개</button>
      <button id="clearBtn" class="tool-btn btn-danger">전체삭제</button>
    </div>
  </nav>

  <main class="canvas-wrapper">
    <canvas id="board"></canvas>
  </main>

  <script src="app.js"></script>
</body>
</html>
